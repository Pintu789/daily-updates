<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अल्टीमेट टिक-टैक-टो - रियल ऑनलाइन मैचमेकिंग</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%); 
            color: #fff;
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        h1 { margin-bottom: 5px; font-size: 26px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .status { font-size: 16px; margin-bottom: 15px; color: #f0f0f0; font-weight: bold; background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .screen-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 25, 0.95); display: flex; justify-content: center; align-items: center; z-index: 10; }
        .box { background: #22223b; padding: 30px; border-radius: 15px; text-align: center; max-width: 380px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .box h2 { margin-top: 0; color: #f72585; font-size: 22px; }
        .box p { color: #b5179e; font-size: 13px; margin-bottom: 20px; }
        
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #4361ee; border-radius: 8px; background: #1e1e2f; color: #fff; font-size: 15px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #f72585; }

        .game-container { display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 10px; }
        
        .board { display: grid; grid-template-columns: repeat(3, 95px); grid-gap: 8px; justify-content: center; background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .cell { width: 95px; height: 95px; background-color: #3a0ca3; color: #fff; font-size: 40px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: all 0.2s ease; }
        .cell:hover { background-color: #4361ee; transform: translateY(-2px); }

        .player-info-card { background: #22223b; padding: 12px 18px; border-radius: 12px; font-size: 15px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; width: 180px; text-align: center; }
        .player-info-card span { color: #4cc9f0; font-weight: bold; display: block; font-size: 16px; margin-top: 3px; }

        .reaction-box {
            background: #22223b;
            padding: 10px 15px;
            border-radius: 30px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .emoji-btn {
            font-size: 20px;
            background: #3a0ca3;
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .emoji-btn:hover { transform: scale(1.2); background: #4361ee; }

        #chat-display {
            width: 45px;
            height: 45px;
            font-size: 24px;
            background: linear-gradient(135deg, #f72585 0%, #7209b7 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-left: 5px;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .winner-animation { animation: winPulse 0.8s infinite alternate; }
        @keyframes winPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px #4cc9f0); }
            100% { transform: scale(1.03); filter: drop-shadow(0 0 25px #4cc9f0); }
        }

        .loser-animation { animation: loseShake 0.5s ease; }
        @keyframes loseShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .side-panel { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .controls { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        .btn { background-color: #4cc9f0; color: #1e1e2f; border: none; padding: 10px 20px; font-size: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: all 0.2s; }
        .btn:hover { background-color: #3fe0ff; transform: translateY(-2px); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. प्रोफाइल रजिस्ट्रेशन स्क्रीन -->
    <div id="profile-screen" class="screen-overlay">
        <div class="box">
            <h2>अपना नाम दर्ज करें</h2>
            <p>ऑनलाइन खेलने के लिए अपनी पहचान दें</p>
            <input type="text" id="user-name" placeholder="आपका नाम (जैसे: राहुल)">
            <button class="btn" style="width: 100%; margin-top: 10px; background-color: #4cc9f0;" onclick="saveProfile()">आगे बढ़ें</button>
        </div>
    </div>

    <!-- 2. गेम मोड चयन स्क्रीन -->
    <div id="mode-screen" class="screen-overlay hidden">
        <div class="box">
            <h2>गेम मोड चुनें</h2>
            <p>असली खिलाड़ियों के साथ ऑनलाइन मुकाबला करें</p>
            <button class="btn" style="width: 100%; margin-bottom: 12px; background-color: #4cc9f0;" onclick="selectMode('online')">🌐 असली ऑनलाइन प्लेयर खोजें (1 मिनट)</button>
            <button class="btn" style="width: 100%; background-color: #f72585; color: white;" onclick="selectMode('local')">🤖 लोकल (असंभव हार्ड बॉट)</button>
        </div>
    </div>

    <h1>टिक-टैक-टो अल्टीमेट</h1>
    <div class="status" id="status">गेम शुरू होने वाला है...</div>

    <div class="game-container" id="main-container">
        <div class="side-panel">
            <div class="player-info-card">
                <div>खिलाड़ी 1 (X)</div>
                <span id="p1-display">---</span>
            </div>
            <div class="player-info-card">
                <div>खिलाड़ी 2 (O)</div>
                <span id="p2-display">---</span>
            </div>
        </div>

        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>

        <div class="side-panel">
            <div class="reaction-box">
                <button class="emoji-btn" onclick="sendEmoji('👍')" onmousedown="startHold('👍')" ontouchstart="startHold('👍')">👍</button>
                <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
                <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
                <button class="emoji-btn" onclick="sendEmoji('😎')">😎</button>
                <button class="emoji-btn" onclick="sendEmoji('😮')">😮</button>
                <div id="chat-display">💬</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="resetGame()">गेम रीसेट करें</button>
        <button class="btn" style="background-color: #f72585; color: white;" onclick="goHome()">मोड बदलें</button>
    </div>

    <!-- Firebase Realtime Database Scripts & Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue, remove, child } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3HUZgZ1G2hN4BXnIbRV8eD0nPlWUaByM",
            authDomain: "galk-55f49.firebaseapp.com",
            projectId: "galk-55f49",
            storageBucket: "galk-55f49.firebasestorage.app",
            messagingSenderId: "1005825050326",
            appId: "1:1005825050326:web:fda4271183b4c4ff106b77",
            measurementId: "G-32CW801HFV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myName = "";
        let opponentName = "";
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = false;
        let gameMode = "";
        let myRole = ""; // 'X' या 'O'
        let currentRoomId = null;
        let searchInterval = null;
        let roomListener = null;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        window.saveProfile = function() {
            let nameInput = document.getElementById('user-name').value.trim();
            if (!nameInput) {
                alert("कृपया अपना नाम दर्ज करें!");
                return;
            }
            myName = nameInput;
            document.getElementById('profile-screen').classList.add('hidden');
            document.getElementById('mode-screen').classList.remove('hidden');
            document.getElementById('p1-display').innerText = myName;
        }

        window.selectMode = function(mode) {
            gameMode = mode;
            document.getElementById('mode-screen').classList.add('hidden');

            if (mode === 'online') {
                findOrCreateRoom();
            } else {
                opponentName = "असंभव बॉट";
                document.getElementById('p2-display').innerText = opponentName;
                myRole = "X";
                isGameActive = true;
                document.getElementById('status').innerText = `${myName} की बारी (X) है`;
            }
        }

        // असली ऑनलाइन मैचमेकिंग (Firebase के ज़रिए)
        function findOrCreateRoom() {
            let timeLeft = 60; // 1 मिनट (60 सेकंड) का असली टाइमर
            document.getElementById('status').innerText = `रियल ऑनलाइन प्लेयर खोजे जा रहे हैं... (${timeLeft}s)`;

            const waitingRef = ref(db, 'matchmaking/waitingRoom');
            
            get(waitingRef).then((snapshot) => {
                if (snapshot.exists()) {
                    // अगर कोई दूसरा खिलाड़ी पहले से वेटिंग में है, तो उसके रूम से जुड़ जाओ
                    let roomData = snapshot.val();
                    currentRoomId = roomData.roomId;
                    opponentName = roomData.player1Name;
                    myRole = "O";

                    // रूम को अपडेट करो कि दूसरा खिलाड़ी आ गया है
                    update(ref(db, `rooms/${currentRoomId}`), {
                        player2Name: myName,
                        status: 'playing'
                    }).then(() => {
                        remove(waitingRef); // वेटिंग रूम खाली करो
                        startGameOnline();
                    });
                } else {
                    // अगर कोई नहीं है, तो नया रूम बनाओ और वेटिंग में बैठो
                    currentRoomId = 'room_' + Date.now();
                    const roomRef = ref(db, `rooms/${currentRoomId}`);
                    
                    set(roomRef, {
                        roomId: currentRoomId,
                        player1Name: myName,
                        player2Name: "",
                        status: 'waiting',
                        board: ["","","","","","","","",""],
                        turn: "X",
                        winner: null
                    }).then(() => {
                        set(waitingRef, {
                            roomId: currentRoomId,
                            player1Name: myName
                        });

                        // 1 मिनट का टाइमर चलाएं
                        searchInterval = setInterval(() => {
                            timeLeft--;
                            if (timeLeft > 0) {
                                document.getElementById('status').innerText = `रियल ऑनलाइन प्लेयर खोजे जा रहे हैं... (${timeLeft}s)`;
                                
                                // चेक करो कि क्या किसी ने रूम ज्वाइन कर लिया है
                                get(child(ref(db), `rooms/${currentRoomId}/player2Name`)).then((snap) => {
                                    if(snap.exists() && snap.val() !== "") {
                                        clearInterval(searchInterval);
                                        myRole = "X";
                                        opponentName = snap.val();
                                        remove(waitingRef);
                                        startGameOnline();
                                    }
                                });
                            } else {
                                // 1 मिनट पूरा होने पर कोई नहीं मिला -> बॉट से कनेक्ट करो
                                clearInterval(searchInterval);
                                remove(waitingRef);
                                remove(ref(db, `rooms/${currentRoomId}`));
                                
                                document.getElementById('status').innerText = "1 मिनट में कोई असली खिलाड़ी नहीं मिला! बॉट से मुकाबला शुरू...";
                                setTimeout(() => {
                                    gameMode = 'local';
                                    opponentName = "असंभव बॉट";
                                    document.getElementById('p2-display').innerText = opponentName;
                                    myRole = "X";
                                    isGameActive = true;
                                    document.getElementById('status').innerText = `${myName} की बारी (X) है`;
                                }, 1500);
                            }
                        }, 1000);
                    });
                }
            });
        }

        function startGameOnline() {
            document.getElementById('p2-display').innerText = opponentName;
            isGameActive = true;
            document.getElementById('status').innerText = `मैच शुरू! खिलाड़ी ${myRole === 'X' ? myName : opponentName} की बारी है।`;

            // डेटाबेस पर बोर्ड और गेम की स्थिति को सुनना (Realtime Sync)
            const roomRef = ref(db, `rooms/${currentRoomId}`);
            roomListener = onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                board = data.board;
                updateBoardUI();

                if (data.winner) {
                    isGameActive = false;
                    let container = document.getElementById('main-container');
                    if (data.winner === myRole) {
                        document.getElementById('status').innerText = `🥳 अद्भुत! ${myName} जीत गए! 🎉`;
                        container.classList.add('winner-animation');
                    } else if (data.winner === 'draw') {
                        document.getElementById('status').innerText = "🤝 मुकाबला बराबरी (Draw) पर छूटा!";
                    } else {
                        document.getElementById('status').innerText = `🤖 ${opponentName} जीत गया!`;
                        container.classList.add('loser-animation');
                    }
                    return;
                }

                currentPlayer = data.turn;
                if (currentPlayer === myRole) {
                    document.getElementById('status').innerText = `आपकी बारी (${myRole}) है`;
                } else {
                    document.getElementById('status').innerText = `${opponentName} (${currentPlayer}) की बारी है...`;
                }
            });
        }

        window.makeMove = function(index) {
            if (board[index] !== "" || !isGameActive) return;

            if (gameMode === 'local') {
                if (currentPlayer !== "X") return;
                board[index] = "X";
                updateBoardUI();
                if (checkGameOverLocal()) return;

                currentPlayer = "O";
                document.getElementById('status').innerText = `${opponentName} चाल चल रहा है...`;
                setTimeout(botMoveLocal, 600);
            } else {
                // ऑनलाइन मोड में चाल Firebase पर भेजना
                if (currentPlayer !== myRole) return;

                board[index] = myRole;
                let nextTurn = myRole === "X" ? "O" : "X";
                let winRes = checkWinnerCondition(board);

                update(ref(db, `rooms/${currentRoomId}`), {
                    board: board,
                    turn: nextTurn,
                    winner: winRes
                });
            }
        }

        function botMoveLocal() {
            if (!isGameActive) return;
            let bestScore = -Infinity;
            let move;
            for (let i = 0; i < 9; i++) {
                if (board[i] === "") {
                    board[i] = "O";
                    let score = minimax(board, 0, false);
                    board[i] = "";
                    if (score > bestScore) {
                        bestScore = score;
                        move = i;
                    }
                }
            }
            if (move !== undefined) {
                board[move] = "O";
                updateBoardUI();
            }
            if (checkGameOverLocal()) return;
            currentPlayer = "X";
            document.getElementById('status').innerText = `${myName} की बारी (X) है`;
        }

        function checkWinnerCondition(b) {
            for (let i = 0; i < winningConditions.length; i++) {
                let [a, c, d] = winningConditions[i];
                if (b[a] !== "" && b[a] === b[c] && b[c] === b[d]) {
                    return b[a]; // 'X' या 'O'
                }
            }
            if (!b.includes("")) return "draw";
            return null;
        }

        function checkGameOverLocal() {
            let res = checkWinnerCondition(board);
            if (res !== null) {
                isGameActive = false;
                let container = document.getElementById('main-container');
                if (res === "X") {
                    document.getElementById('status').innerText = `🥳 अद्भुत! ${myName} जीत गए! 🎉`;
                    container.classList.add('winner-animation');
                } else if (res === "O") {
                    document.getElementById('status').innerText = `🤖 ${opponentName} जीत गया!`;
                    container.classList.add('loser-animation');
                } else {
                    document.getElementById('status').innerText = "🤝 मुकाबला बराबरी (Draw) पर छूटा!";
                }
                return true;
            }
            return false;
        }

        function minimax(newBoard, depth, isMaximizing) {
            let result = checkWinnerCondition(newBoard);
            if (result !== null) {
                if (result === "O") return 10 - depth;
                if (result === "X") return depth - 10;
                return 0;
