<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अल्टीमेट टिक-टैक-टो - ऑटो रीमैच और वॉइस</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%); 
            color: #fff;
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 { margin-bottom: 5px; font-size: 26px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .status { font-size: 16px; margin-bottom: 15px; color: #fff; font-weight: bold; background: rgba(255,255,255,0.15); padding: 8px 16px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .screen-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 25, 0.95); display: flex; justify-content: center; align-items: center; z-index: 10; }
        .box { background: #22223b; padding: 30px; border-radius: 15px; text-align: center; max-width: 380px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .box h2 { margin-top: 0; color: #f72585; font-size: 22px; }
        .box p { color: #ddd; font-size: 13px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #4361ee; border-radius: 8px; background: #1e1e2f; color: #fff; font-size: 15px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #f72585; }
        .game-container { display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 10px; position: relative; }
        .board { display: grid; grid-template-columns: repeat(3, 95px); grid-gap: 8px; justify-content: center; background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .cell { width: 95px; height: 95px; background-color: #3a0ca3; color: #fff; font-size: 40px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: all 0.2s ease; }
        .cell:hover { background-color: #4361ee; transform: translateY(-2px); }
        .player-info-card { background: #22223b; padding: 10px 15px; border-radius: 12px; font-size: 14px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px; width: 180px; text-align: center; color: #fff; }
        .player-info-card span { color: #4cc9f0; font-weight: bold; display: block; font-size: 15px; margin-top: 2px; }
        
        .voice-controls { display: flex; gap: 8px; justify-content: center; margin-top: 5px; }
        .voice-btn { background: #4361ee; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .voice-btn.muted { background: #f72585; }

        .reaction-box { background: #22223b; padding: 10px 15px; border-radius: 30px; box-shadow: 0 6px 15px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .emoji-btn { font-size: 20px; background: #3a0ca3; border: none; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; color: #fff; }
        .emoji-btn:hover { transform: scale(1.2); background: #4361ee; }
        #chat-display { width: 45px; height: 45px; font-size: 24px; background: linear-gradient(135deg, #f72585 0%, #7209b7 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-left: 5px; color: #fff; }
        .floating-emoji { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.5); font-size: 80px; z-index: 100; pointer-events: none; animation: tauntZoomFade 1.2s ease-out forwards; }
        @keyframes tauntZoomFade { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 40% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; filter: drop-shadow(0 0 20px #f72585); } 100% { transform: translate(-50%, -70%) scale(1.2); opacity: 0; } }
        .winner-animation { animation: winPulse 0.8s infinite alternate; }
        @keyframes winPulse { 0% { transform: scale(1); filter: drop-shadow(0 0 10px #4cc9f0); } 100% { transform: scale(1.03); filter: drop-shadow(0 0 25px #4cc9f0); } }
        .loser-animation { animation: loseShake 0.5s ease; }
        @keyframes loseShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
        .side-panel { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .controls { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        .btn { background-color: #4cc9f0; color: #1e1e2f; border: none; padding: 10px 20px; font-size: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: all 0.2s; }
        .btn:hover { background-color: #3fe0ff; transform: translateY(-2px); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="profile-screen" class="screen-overlay">
        <div class="box">
            <h2>अपना नाम दर्ज करें</h2>
            <p>वॉइस चैट के साथ ऑनलाइन खेलने के लिए नाम दें</p>
            <input type="text" id="user-name" placeholder="आपका नाम (जैसे: राहुल)" autocomplete="off">
            <button class="btn" style="width: 100%; margin-top: 10px; background-color: #4cc9f0;" onclick="saveProfile()">आगे बढ़ें</button>
        </div>
    </div>
    <div id="mode-screen" class="screen-overlay hidden">
        <div class="box">
            <h2>गेम मोड चुनें</h2>
            <p>ऑनलाइन या बॉट के साथ खेलें</p>
            <button class="btn" style="width: 100%; margin-bottom: 12px; background-color: #4cc9f0;" onclick="selectMode('online')">🌐 वॉइस चैट ऑनलाइन प्लेयर खोजें</button>
            <button class="btn" style="width: 100%; background-color: #f72585; color: white;" onclick="selectMode('local')">🤖 लोकल (असंभव हार्ड बॉट)</button>
        </div>
    </div>
    <h1>टिक-टैक-टो अल्टीमेट (Voice Chat)</h1>
    <div class="status" id="status">गेम शुरू होने वाला है...</div>
    <div class="game-container" id="main-container">
        <div class="side-panel">
            <div class="player-info-card">
                <div>खिलाड़ी (आप)</div>
                <span id="p1-display">---</span>
                <div class="voice-controls" id="my-voice-controls" style="display:none;">
                    <button id="mic-btn" class="voice-btn muted" onclick="toggleMic()">🔇 माइक बंद</button>
                    <button id="spk-btn" class="voice-btn" onclick="toggleSpeaker()">🔊 स्पीकर चालू</button>
                </div>
            </div>
            <div class="player-info-card">
                <div>प्रतिद्वंद्वी</div>
                <span id="p2-display">---</span>
            </div>
        </div>
        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
        <div class="side-panel">
            <div class="reaction-box">
                <button class="emoji-btn" onclick="sendEmoji('👍')">👍</button>
                <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
                <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
                <button class="emoji-btn" onclick="sendEmoji('😎')">😎</button>
                <button class="emoji-btn" onclick="sendEmoji('😮')">😮</button>
                <div id="chat-display">💬</div>
            </div>
        </div>
    </div>
    <div class="controls">
        <button class="btn" onclick="resetGame()">मैनुअल रीसेट</button>
        <button class="btn" style="background-color: #f72585; color: white;" onclick="goHome()">मोड बदलें</button>
    </div>
        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3HUZgZ1G2hN4BXnIbRV8eD0nPlWUaByM",
            authDomain: "galk-55f49.firebaseapp.com",
            databaseURL: "https://galk-55f49-default-rtdb.firebaseio.com",
            projectId: "galk-55f49",
            storageBucket: "galk-55f49.firebasestorage.app",
            messagingSenderId: "1005825050326",
            appId: "1:1005825050326:web:fda4271183b4c4ff106b77",
            measurementId: "G-32CW801HFV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myName = "";
        let opponentName = "";
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = false;
        let gameMode = "";
        let myRole = ""; 
        let currentRoomId = null;
        let searchInterval = null;
        let roomListener = null;

        let peer = null;
        let myPeerId = null;
        let localStream = null;
        let remoteAudio = document.createElement('audio');
        remoteAudio.autoplay = true;
        let isMicMuted = true; // डिफ़ॉल्ट रूप से माइक बंद ताकि परमिशन इश्यू न हो
        let isSpeakerMuted = false;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        window.addEventListener('beforeunload', () => { cleanupRoom(); });

        function cleanupRoom() {
            if (currentRoomId) remove(ref(db, `rooms/${currentRoomId}`));
            remove(ref(db, 'matchmaking/waiting'));
            if (peer) peer.destroy();
        }

        window.saveProfile = function() {
            let nameInput = document.getElementById('user-name').value.trim();
            if (!nameInput) {
                alert("कृपया अपना नाम दर्ज करें!");
                return;
            }
            myName = nameInput;
            document.getElementById('profile-screen').style.display = 'none';
            document.getElementById('mode-screen').classList.remove('hidden');
            document.getElementById('p1-display').innerText = myName;

            initPeerJS();
        }

        function initPeerJS() {
            peer = new Peer();
            peer.on('open', (id) => { myPeerId = id; });

            peer.on('call', (call) => {
                navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then((stream) => {
                    localStream = stream;
                    stream.getAudioTracks()[0].enabled = false; // Initially muted
                    call.answer(stream);
                    call.on('stream', (remoteStream) => {
                        remoteAudio.srcObject = remoteStream;
                    });
                }).catch(err => console.log("Voice setup error:", err));
            });
        }

        window.selectMode = function(mode) {
            gameMode = mode;
            document.getElementById('mode-screen').classList.add('hidden');
            if (mode === 'online') {
                document.getElementById('my-voice-controls').style.display = 'flex';
                findOrCreateRoom();
            } else {
                opponentName = "असंभव बॉट";
                document.getElementById('p2-display').innerText = opponentName;
                myRole = "X";
                isGameActive = true;
                document.getElementById('status').innerText = `${myName} की बारी (X) है`;
            }
        }

        function findOrCreateRoom() {
            let timeLeft = 60; 
            document.getElementById('status').innerText = `ऑनलाइन प्लेयर और वॉइस चैनल खोजे जा रहे हैं... (${timeLeft}s)`;
            const waitingRoomRef = ref(db, 'matchmaking/waiting');
            
            get(waitingRoomRef).then((snapshot) => {
                let existingWaiting = snapshot.val();
                if (existingWaiting && existingWaiting.timestamp && (Date.now() - existingWaiting.timestamp > 120000)) {
                    remove(waitingRoomRef);
                    existingWaiting = null;
                }

                if (existingWaiting) {
                    currentRoomId = existingWaiting.roomId;
                    opponentName = existingWaiting.player1Name;
                    let p1PeerId = existingWaiting.peerId;
                    myRole = "O";

                    update(ref(db, `rooms/${currentRoomId}`), {
                        player2Name: myName,
                        player2Peer: myPeerId,
                        status: 'playing'
                    }).then(() => {
                        remove(waitingRoomRef);
                        startGameOnline();
                        connectAudioCall(p1PeerId);
                    });
                } else {
                    currentRoomId = 'room_' + Date.now();
                    set(ref(db, `rooms/${currentRoomId}`), {
                        roomId: currentRoomId,
                        player1Name: myName,
                        player1Peer: myPeerId,
                        player2Name: "",
                        player2Peer: "",
                        board: ["","","","","","","","",""],
                        turn: "X",
                        winner: null,
                        lastEmoji: ""
                    }).then(() => {
                        set(waitingRoomRef, {
                            roomId: currentRoomId,
                            player1Name: myName,
                            peerId: myPeerId,
                            timestamp: Date.now()
                        });

                        searchInterval = setInterval(() => {
                            timeLeft--;
                            if (timeLeft > 0) {
                                document.getElementById('status').innerText = `ऑनलाइन प्लेयर खोजे जा रहे हैं... (${timeLeft}s)`;
                                get(ref(db, `rooms/${currentRoomId}/player2Name`)).then((snap) => {
                                    if(snap.exists() && snap.val() !== "") {
                                        clearInterval(searchInterval);
                                        myRole = "X";
                                        opponentName = snap.val();
                                        
                                        get(ref(db, `rooms/${currentRoomId}/player2Peer`)).then((p2Snap) => {
                                            if(p2Snap.exists()) {
                                                connectAudioCall(p2Snap.val());
                                            }
                                        });

                                        startGameOnline();
                                    }
                                });
                            } else {
                                clearInterval(searchInterval);
                                remove(waitingRoomRef);
                                remove(ref(db, `rooms/${currentRoomId}`));
                                document.getElementById('status').innerText = "कोई खिलाड़ी नहीं मिला! बॉट से मुकाबला शुरू...";
                                setTimeout(() => {
                                    gameMode = 'local';
                                    opponentName = "असंभव बॉट";
                                    document.getElementById('p2-display').innerText = opponentName;
                                    myRole = "X";
                                    isGameActive = true;
                                    document.getElementById('status').innerText = `${myName} की बारी (X) है`;
                                }, 1500);
                            }
                        }, 1000);
                    });
                }
            });
        }

        function connectAudioCall(targetPeerId) {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then((stream) => {
                localStream = stream;
                stream.getAudioTracks()[0].enabled = false;
                let call = peer.call(targetPeerId, stream);
                call.on('stream', (remoteStream) => {
                    remoteAudio.srcObject = remoteStream;
                });
            }).catch(err => console.log("Audio permission needed:", err));
        }

        function startGameOnline() {
            document.getElementById('p2-display').innerText = opponentName;
            isGameActive = true;
            document.getElementById('status').innerText = `मैच शुरू! ${myRole === 'X' ? myName : opponentName} की बारी है।`;

            const roomRef = ref(db, `rooms/${currentRoomId}`);
            roomListener = onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                board = data.board;
                updateBoardUI();

                if (data.lastEmoji && data.lastEmojiSender !== myName) {
                    showTauntEmoji(data.lastEmoji);
                }

                if (data.winner) {
                    isGameActive = false;
                    let container = document.getElementById('main-container');
                    container.classList.remove('winner-animation', 'loser-animation');
                    
                    if (data.winner === myRole) {
                        document.getElementById('status').innerText = `🥳 अद्भुत! ${myName} जीत गए! 🎉`;
                        container.classList.add('winner-animation');
                    } else if (data.winner === 'draw') {
                        document.getElementById('status').innerText = "🤝 मुकाबला बराबरी (Draw) पर छूटा!";
                    } else {
                        document.getElementById('status').innerText = `🤖 ${opponentName} जीत गया!`;
                        container.classList.add('loser-animation');
                    }

                    // 3 सेकंड बाद उसी प्लेयर के साथ ऑटोमैटिक नया राउंड शुरू (Rematch)
                    setTimeout(() => {
                        if (gameMode === 'online' && currentRoomId) {
                            // सिर्फ रूम क्रिएटर (X वाला) नया बोर्ड रीसेट करेगा ताकि डेटाबेस में बार-बार ओवरराइट न हो
                            if (myRole === 'X') {
                                update(ref(db, `rooms/${currentRoomId}`), {
                                    board: ["","","","","","","","",""],
                                    turn: "X",
                                    winner: null,
                                    lastEmoji: ""
                                });
                            }
                        }
                    }, 3000);

                    return;
                }

                currentPlayer = data.turn;
                if (currentPlayer === myRole) {
                    document.getElementById('status').innerText = `आपकी बारी (${myRole}) है`;
                } else {
                    document.getElementById('status').innerText = `${opponentName} (${currentPlayer}) की बारी है...`;
                }
            });
        }

        window.toggleMic = function() {
            if (!localStream) {
                navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then(stream => {
                    localStream = stream;
                    toggleMicState();
                }).catch(err => alert("कृपया ब्राउज़र सेटिंग में माइक की अनुमति दें!"));
            } else {
                toggleMicState();
            }
        }

        function toggleMicState() {
            isMicMuted = !isMicMuted;
            localStream.getAudioTracks()[0].enabled = !isMicMuted;
            let btn = document.getElementById('mic-btn');
            if (isMicMuted) {
                btn.innerText = "🔇 माइक बंद";
                btn.classList.add('muted');
            } else {
                btn.innerText = "🎤 माइक चालू";
                btn.classList.remove('muted');
            }
        }

        window.toggleSpeaker = function() {
            isSpeakerMuted = !isSpeakerMuted;
            remoteAudio.muted = isSpeakerMuted;
            let btn = document.getElementById('spk-btn');
            if (isSpeakerMuted) {
                btn.innerText = "🔇 स्पीकर बंद";
                btn.classList.add('muted');
            } else {
                btn.innerText = "🔊 स्पीकर चालू";
                btn.classList.remove('muted');
            }
        }

        window.makeMove = function(index) {
            if (board[index] !== "" || !isGameActive) return;

            if (gameMode === 'local') {
                if (currentPlayer !== "X") return;
                board[index] = "X";
                updateBoardUI();
                if (checkGameOverLocal()) return;

                currentPlayer = "O";
                document.getElementById('status').innerText = `${opponentName} चाल चल रहा है...`;
                setTimeout(botMoveLocal, 600);
            } else {
                if (currentPlayer !== myRole) return;

                board[index] = myRole;
                let nextTurn = myRole === "X" ? "O" : "X";
                let winRes = checkWinnerCondition(board);

                update(ref(db, `rooms/${currentRoomId}`), {
                    board: board,
                    turn: nextTurn,
                    winner: winRes
                });
            }
        }

        function botMoveLocal() {
            if (!isGameActive) return;
            let bestScore = -Infinity;
            let move;
            for (let i = 0; i < 9; i++) {
                if (board[i] === "") {
                    board[i] = "O";
                    let score = minimax(board, 0, false);
                    board[i] = "";
                    if (score > bestScore) {
                        bestScore = score;
                        move = i;
                    }
                }
            }
            if (move !== undefined) {
                board[move] = "O";
                updateBoardUI();
            }
            if (checkGameOverLocal()) return;
            currentPlayer = "X";
            document.getElementById('status').innerText = `${myName} की बारी (X) है`;
        }

        function checkWinnerCondition(b) {
            for (let i = 0; i < winningConditions.length; i++) {
                let [a, c, d] = winningConditions[i];
                if (b[a] !== "" && b[a] === b[c] && b[c] === b[d]) {
                    return b[a]; 
                }
            }
            if (!b.includes("")) return "draw";
            return null;
        }

        function checkGameOverLocal() {
            let res = checkWinnerCondition(board);
            if (res !== null) {
                isGameActive = false;
                let container = document.getElementById('main-container');
                container.classList.remove('winner-animation', 'loser-animation');
                
                if (res === "X") {
                    document.getElementById('status').innerText = `🥳 अद्भुत! ${myName} जीत गए! 🎉`;
                    container.classList.add('winner-animation');
                } else if (res === "O") {
                    document.getElementById('status').innerText = `🤖 ${opponentName} जीत गया!`;
                    container.classList.add('loser-animation');
                } else {
                    document.getElementById('status').innerText = "🤝 मुकाबला बराबरी (Draw) पर छूटा!";
                }

                // लोकल बॉट के लिए भी 3 सेकंड बाद ऑटो रीमैच
                setTimeout(() => {
                    resetGame();
                }, 3000);

                return true;
            }
            return false;
        }

        function minimax(newBoard, depth, isMaximizing) {
            let result = checkWinnerCondition(newBoard);
            if (result !== null) {
                if (result === "O") return 10 - depth;
                if (result === "X") return depth - 10;
                return 0;
            }
            if (isMaximizing) {
                let maxScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (newBoard[i] === "") {
                        newBoard[i] = "O";
                        let score = minimax(newBoard, depth + 1, false);
                        newBoard[i] = "";
                        maxScore = Math.max(score, maxScore);
                    }
                }
                return maxScore;
            } else {
                let minScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (newBoard[i] === "") {
                        newBoard[i] = "X";
                        let score = minimax(newBoard, depth + 1, true);
                        newBoard[i] = "";
                        minScore = Math.min(score, minScore);
                    }
                }
                return minScore;
            }
        }

        function updateBoardUI() {
            let cells = document.getElementsByClassName('cell');
            for (let i = 0; i < board.length; i++) {
                cells[i].innerText = board[i];
            }
        }

        window.sendEmoji = function(emoji) {
            document.getElementById('chat-display').innerText = emoji;
            showTauntEmoji(emoji);

            if (gameMode === 'online' && currentRoomId) {
                update(ref(db, `rooms/${currentRoomId}`), {
                    lastEmoji: emoji,
                    lastEmojiSender: myName
                });
            } else if (gameMode === 'local' && isGameActive && currentPlayer === "O") {
                setTimeout(() => {
                    let botEmojis = ['🤖', '🔥', '😎', '😈', '😏'];
                    let randomEmoji = botEmojis[Math.floor(Math.random() * botEmojis.length)];
                    document.getElementById('chat-display').innerText = randomEmoji;
                    showTauntEmoji(randomEmoji);
                }, 600);
            }
        }

        function showTauntEmoji(emoji) {
            let floatingDiv = document.createElement('div');
            floatingDiv.className = 'floating-emoji';
            floatingDiv.innerText = emoji;
            document.body.appendChild(floatingDiv);
            setTimeout(() => { floatingDiv.remove(); }, 1200);
        }

        window.resetGame = function() {
            if (gameMode === 'online' && currentRoomId) {
                if (myRole === 'X') {
                    update(ref(db, `rooms/${currentRoomId}`), {
                        board: ["","","","","","","","",""],
                        turn: "X",
                        winner: null,
                        lastEmoji: ""
                    });
                }
            } else {
                board = ["", "", "", "", "", "", "", "", ""];
                isGameActive = true;
                currentPlayer = "X";
                updateBoardUI();
                document.getElementById('status').innerText = `${myName} की बारी (X) है`;
            }
            document.getElementById('chat-display').innerText = "💬";
            let container = document.getElementById('main-container');
            container.classList.remove('winner-animation');
            container.classList.remove('loser-animation');
        }

        window.goHome = function() {
            cleanupRoom();
            document.getElementById('profile-screen').style.display = 'flex';
            document.getElementById('mode-screen').classList.add('hidden');
            document.getElementById('my-voice-controls').style.display = 'none';
            isGameActive = false;
        }
    </script>
</body>
</html>
