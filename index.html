<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> -- -  </title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%); 
            color: #fff;
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 { margin-bottom: 5px; font-size: 26px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .status { font-size: 16px; margin-bottom: 15px; color: #f0f0f0; font-weight: bold; background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .screen-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 25, 0.95); display: flex; justify-content: center; align-items: center; z-index: 10; }
        .box { background: #22223b; padding: 30px; border-radius: 15px; text-align: center; max-width: 380px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .box h2 { margin-top: 0; color: #f72585; font-size: 22px; }
        .box p { color: #b5179e; font-size: 13px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #4361ee; border-radius: 8px; background: #1e1e2f; color: #fff; font-size: 15px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #f72585; }
        .game-container { display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 10px; }
        .board { display: grid; grid-template-columns: repeat(3, 95px); grid-gap: 8px; justify-content: center; background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .cell { width: 95px; height: 95px; background-color: #3a0ca3; color: #fff; font-size: 40px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: all 0.2s ease; }
        .cell:hover { background-color: #4361ee; transform: translateY(-2px); }
        .player-info-card { background: #22223b; padding: 12px 18px; border-radius: 12px; font-size: 15px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; width: 180px; text-align: center; }
        .player-info-card span { color: #4cc9f0; font-weight: bold; display: block; font-size: 16px; margin-top: 3px; }
        .reaction-box { background: #22223b; padding: 10px 15px; border-radius: 30px; box-shadow: 0 6px 15px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .emoji-btn { font-size: 20px; background: #3a0ca3; border: none; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .emoji-btn:hover { transform: scale(1.2); background: #4361ee; }
        #chat-display { width: 45px; height: 45px; font-size: 24px; background: linear-gradient(135deg, #f72585 0%, #7209b7 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-left: 5px; animation: popIn 0.3s ease; }
        @keyframes popIn { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .winner-animation { animation: winPulse 0.8s infinite alternate; }
        @keyframes winPulse { 0% { transform: scale(1); filter: drop-shadow(0 0 10px #4cc9f0); } 100% { transform: scale(1.03); filter: drop-shadow(0 0 25px #4cc9f0); } }
        .loser-animation { animation: loseShake 0.5s ease; }
        @keyframes loseShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
        .side-panel { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .controls { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        .btn { background-color: #4cc9f0; color: #1e1e2f; border: none; padding: 10px 20px; font-size: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: all 0.2s; }
        .btn:hover { background-color: #3fe0ff; transform: translateY(-2px); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="profile-screen" class="screen-overlay">
        <div class="box">
            <h2>   </h2>
            <p>      </p>
            <input type="text" id="user-name" placeholder="  (: )" autocomplete="off">
            <button class="btn" style="width: 100%; margin-top: 10px; background-color: #4cc9f0;" onclick="saveProfile()"> </button>
        </div>
    </div>
    <div id="mode-screen" class="screen-overlay hidden">
        <div class="box">
            <h2>  </h2>
            <p>      </p>
            <button class="btn" style="width: 100%; margin-bottom: 12px; background-color: #4cc9f0;" onclick="selectMode('online')">     (1 )</button>
            <button class="btn" style="width: 100%; background-color: #f72585; color: white;" onclick="selectMode('local')">  (  )</button>
        </div>
    </div>
    <h1>-- </h1>
    <div class="status" id="status">    ...</div>
    <div class="game-container" id="main-container">
        <div class="side-panel">
            <div class="player-info-card">
                <div> 1 (X)</div>
                <span id="p1-display">---</span>
            </div>
            <div class="player-info-card">
                <div> 2 (O)</div>
                <span id="p2-display">---</span>
            </div>
        </div>
        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
        <div class="side-panel">
            <div class="reaction-box">
                <button class="emoji-btn" onclick="sendEmoji('')" onmousedown="startHold('')" ontouchstart="startHold('')"></button>
                <button class="emoji-btn" onclick="sendEmoji('')"></button>
                <button class="emoji-btn" onclick="sendEmoji('')"></button>
                <button class="emoji-btn" onclick="sendEmoji('')"></button>
                <button class="emoji-btn" onclick="sendEmoji('')"></button>
                <div id="chat-display"></div>
            </div>
        </div>
    </div>
    <div class="controls">
        <button class="btn" onclick="resetGame()">  </button>
        <button class="btn" style="background-color: #f72585; color: white;" onclick="goHome()"> </button>
    </div>
        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3HUZgZ1G2hN4BXnIbRV8eD0nPlWUaByM",
            authDomain: "galk-55f49.firebaseapp.com",
            databaseURL: "https://galk-55f49-default-rtdb.firebaseio.com",
            projectId: "galk-55f49",
            storageBucket: "galk-55f49.firebasestorage.app",
            messagingSenderId: "1005825050326",
            appId: "1:1005825050326:web:fda4271183b4c4ff106b77",
            measurementId: "G-32CW801HFV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myName = "";
        let opponentName = "";
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = false;
        let gameMode = "";
        let myRole = ""; 
        let currentRoomId = null;
        let searchInterval = null;
        let roomListener = null;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        window.saveProfile = function() {
            let nameInput = document.getElementById('user-name').value.trim();
            if (!nameInput) {
                alert("    !");
                return;
            }
            myName = nameInput;
            document.getElementById('profile-screen').style.display = 'none';
            document.getElementById('mode-screen').classList.remove('hidden');
            document.getElementById('p1-display').innerText = myName;
        }

        window.selectMode = function(mode) {
            gameMode = mode;
            document.getElementById('mode-screen').classList.add('hidden');
            if (mode === 'online') {
                findOrCreateRoom();
            } else {
                opponentName = " ";
                document.getElementById('p2-display').innerText = opponentName;
                myRole = "X";
                isGameActive = true;
                document.getElementById('status').innerText = `${myName}   (X) `;
            }
        }

        function findOrCreateRoom() {
            let timeLeft = 60; 
            document.getElementById('status').innerText = `      ... (${timeLeft}s)`;

            const waitingRoomRef = ref(db, 'matchmaking/waiting');
            
            get(waitingRoomRef).then((snapshot) => {
                if (snapshot.exists()) {
                    //        ,      
                    let roomData = snapshot.val();
                    currentRoomId = roomData.roomId;
                    opponentName = roomData.player1Name;
                    myRole = "O";

                    update(ref(db, `rooms/${currentRoomId}`), {
                        player2Name: myName,
                        status: 'playing'
                    }).then(() => {
                        remove(waitingRoomRef); //          
                        startGameOnline();
                    });
                } else {
                    //    ,          
                    currentRoomId = 'room_' + Date.now();
                    
                    set(ref(db, `rooms/${currentRoomId}`), {
                        roomId: currentRoomId,
                        player1Name: myName,
                        player2Name: "",
                        board: ["","","","","","","","",""],
                        turn: "X",
                        winner: null
                    }).then(() => {
                        set(waitingRoomRef, {
                            roomId: currentRoomId,
                            player1Name: myName
                        });

                        searchInterval = setInterval(() => {
                            timeLeft--;
                            if (timeLeft > 0) {
                                document.getElementById('status').innerText = `      ... (${timeLeft}s)`;
                                
                                //            
                                get(ref(db, `rooms/${currentRoomId}/player2Name`)).then((snap) => {
                                    if(snap.exists() && snap.val() !== "") {
                                        clearInterval(searchInterval);
                                        myRole = "X";
                                        opponentName = snap.val();
                                        startGameOnline();
                                    }
                                });
                            } else {
                                // 1        
                                clearInterval(searchInterval);
                                remove(waitingRoomRef);
                                remove(ref(db, `rooms/${currentRoomId}`));
                                
                                document.getElementById('status').innerText = "   !    ...";
                                setTimeout(() => {
                                    gameMode = 'local';
                                    opponentName = " ";
                                    document.getElementById('p2-display').innerText = opponentName;
                                    myRole = "X";
                                    isGameActive = true;
                                    document.getElementById('status').innerText = `${myName}   (X) `;
                                }, 1500);
                            }
                        }, 1000);
                    });
                }
            }).catch((error) => {
                console.error(error);
                document.getElementById('status').innerText = " !   ...";
                setTimeout(() => {
                    gameMode = 'local';
                    opponentName = " ";
                    document.getElementById('p2-display').innerText = opponentName;
                    myRole = "X";
                    isGameActive = true;
                    document.getElementById('status').innerText = `${myName}   (X) `;
                }, 1500);
            });
        }

        function startGameOnline() {
            document.getElementById('p2-display').innerText = opponentName;
            isGameActive = true;
            document.getElementById('status').innerText = ` ! ${myRole === 'X' ? myName : opponentName}   `;

            const roomRef = ref(db, `rooms/${currentRoomId}`);
            roomListener = onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                board = data.board;
                updateBoardUI();

                if (data.winner) {
                    isGameActive = false;
                    let container = document.getElementById('main-container');
                    if (data.winner === myRole) {
                        document.getElementById('status').innerText = ` ! ${myName}  ! `;
                        container.classList.add('winner-animation');
                    } else if (data.winner === 'draw') {
                        document.getElementById('status').innerText = "   (Draw)  !";
                    } else {
                        document.getElementById('status').innerText = ` ${opponentName}  !`;
                        container.classList.add('loser-animation');
                    }
                    return;
                }

                currentPlayer = data.turn;
                if (currentPlayer === myRole) {
                    document.getElementById('status').innerText = `  (${myRole}) `;
                } else {
                    document.getElementById('status').innerText = `${opponentName} (${currentPlayer})   ...`;
                }
            });
        }

        window.makeMove = function(index) {
            if (board[index] !== "" || !isGameActive) return;

            if (gameMode === 'local') {
                if (currentPlayer !== "X") return;
                board[index] = "X";
                updateBoardUI();
                if (checkGameOverLocal()) return;

                currentPlayer = "O";
                document.getElementById('status').innerText = `${opponentName}    ...`;
                setTimeout(botMoveLocal, 600);
            } else {
                if (currentPlayer !== myRole) return;

                board[index] = myRole;
                let nextTurn = myRole === "X" ? "O" : "X";
                let winRes = checkWinnerCondition(board);

                update(ref(db, `rooms/${currentRoomId}`), {
                    board: board,
                    turn: nextTurn,
                    winner: winRes
                });
            }
        }

        function botMoveLocal() {
            if (!isGameActive) return;
            let bestScore = -Infinity;
            let move;
            for (let i = 0; i < 9; i++) {
                if (board[i] === "") {
                    board[i] = "O";
                    let score = minimax(board, 0, false);
                    board[i] = "";
                    if (score > bestScore) {
                        bestScore = score;
                        move = i;
                    }
                }
            }
            if (move !== undefined) {
                board[move] = "O";
                updateBoardUI();
            }
            if (checkGameOverLocal()) return;
            currentPlayer = "X";
            document.getElementById('status').innerText = `${myName}   (X) `;
        }

        function checkWinnerCondition(b) {
            for (let i = 0; i < winningConditions.length; i++) {
                let [a, c, d] = winningConditions[i];
                if (b[a] !== "" && b[a] === b[c] && b[c] === b[d]) {
                    return b[a]; 
                }
            }
            if (!b.includes("")) return "draw";
            return null;
        }

        function checkGameOverLocal() {
            let res = checkWinnerCondition(board);
            if (res !== null) {
                isGameActive = false;
                let container = document.getElementById('main-container');
                if (res === "X") {
                    document.getElementById('status').innerText = ` ! ${myName}  ! `;
                    container.classList.add('winner-animation');
                } else if (res === "O") {
                    document.getElementById('status').innerText = ` ${opponentName}  !`;
                    container.classList.add('loser-animation');
                } else {
                    document.getElementById('status').innerText = "   (Draw)  !";
                }
                return true;
            }
            return false;
        }

        function minimax(newBoard, depth, isMaximizing) {
            let result = checkWinnerCondition(newBoard);
            if (result !== null) {
                if (result === "O") return 10 - depth;
                if (result === "X") return depth - 10;
                return 0;
            }
            if (isMaximizing) {
                let maxScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (newBoard[i] === "") {
                        newBoard[i] = "O";
                        let score = minimax(newBoard, depth + 1, false);
                        newBoard[i] = "";
                        maxScore = Math.max(score, maxScore);
                    }
                }
                return maxScore;
            } else {
                let minScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (newBoard[i] === "") {
                        newBoard[i] = "X";
                        let score = minimax(newBoard, depth + 1, true);
                        newBoard[i] = "";
                        minScore = Math.min(score, minScore);
                    }
                }
                return minScore;
            }
        }

        function updateBoardUI() {
            let cells = document.getElementsByClassName('cell');
            for (let i = 0; i < board.length; i++) {
                cells[i].innerText = board[i];
            }
        }

        window.startHold = function(emoji) {
            holdTimer = setTimeout(() => {
                sendEmoji(emoji + "");
            }, 600);
        }

        window.sendEmoji = function(emoji) {
            let chatDisplay = document.getElementById('chat-display');
            chatDisplay.innerText = emoji;
            chatDisplay.style.animation = 'none';
            chatDisplay.offsetHeight; 
            chatDisplay.style.animation = 'popIn 0.3s ease';
        }

        window.resetGame = function() {
            if (gameMode === 'online' && currentRoomId) {
                update(ref(db, `rooms/${currentRoomId}`), {
                    board: ["","","","","","","","",""],
                    turn: "X",
                    winner: null
                });
            } else {
                board = ["", "", "", "", "", "", "", "", ""];
                isGameActive = true;
                currentPlayer = "X";
                updateBoardUI();
                document.getElementById('status').innerText = `${myName}   (X) `;
            }
            document.getElementById('chat-display').innerText = "";
            let container = document.getElementById('main-container');
            container.classList.remove('winner-animation');
            container.classList.remove('loser-animation');
        }

        window.goHome = function() {
            clearInterval(searchInterval);
            if (currentRoomId) {
                remove(ref(db, `rooms/${currentRoomId}`));
            }
            document.getElementById('profile-screen').style.display = 'flex';
            document.getElementById('mode-screen').classList.add('hidden');
            isGameActive = false;
        }
    </script>
</body>
</html>
