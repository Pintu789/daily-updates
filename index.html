<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अल्ट्रा टिक-टैक-टो - हार्ड बॉट और एनिमेशन</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%); 
            color: #fff;
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.5s; 
        }
        
        h1 { margin-bottom: 5px; font-size: 28px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .status { font-size: 18px; margin-bottom: 20px; color: #f0f0f0; font-weight: bold; background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        #mode-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 25, 0.95); display: flex; justify-content: center; align-items: center; z-index: 10; }
        .mode-box { background: #22223b; padding: 40px; border-radius: 15px; text-align: center; max-width: 380px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .mode-box h2 { margin-top: 0; color: #f72585; font-size: 24px; }
        .mode-box p { color: #b5179e; font-size: 14px; margin-bottom: 25px; }

        .game-container { display: flex; justify-content: center; align-items: center; gap: 25px; flex-wrap: wrap; margin-top: 10px; }
        
        .board { display: grid; grid-template-columns: repeat(3, 100px); grid-gap: 10px; justify-content: center; background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .cell { width: 100px; height: 100px; background-color: #3a0ca3; color: #fff; font-size: 45px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: all 0.2s ease; }
        .cell:hover { background-color: #4361ee; transform: translateY(-3px); }

        .reaction-box {
            background: #22223b;
            padding: 12px 18px;
            border-radius: 30px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .emoji-btn {
            font-size: 22px;
            background: #3a0ca3;
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .emoji-btn:hover { transform: scale(1.25); background: #4361ee; }

        #chat-display {
            width: 50px;
            height: 50px;
            font-size: 26px;
            background: linear-gradient(135deg, #f72585 0%, #7209b7 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-left: 5px;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* प्लेयर जीतने पर शानदार हरा एनीमेशन */
        .winner-animation {
            animation: winPulse 0.8s infinite alternate;
        }
        @keyframes winPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px #4cc9f0); }
            100% { transform: scale(1.03); filter: drop-shadow(0 0 25px #4cc9f0); }
        }

        /* बॉट जीतने / प्लेयर हारने पर लाल शेक एनीमेशन */
        .loser-animation {
            animation: loseShake 0.5s ease;
        }
        @keyframes loseShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .side-panel { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .controls { margin-top: 25px; display: flex; gap: 10px; justify-content: center; }
        .btn { background-color: #4cc9f0; color: #1e1e2f; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: all 0.2s; }
        .btn:hover { background-color: #3fe0ff; transform: translateY(-2px); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- मोड चयन स्क्रीन -->
    <div id="mode-screen">
        <div class="mode-box">
            <h2>गेम मोड चुनें</h2>
            <p>चुनें कि आप किस चुनौती के साथ खेलना चाहते हैं</p>
            <button class="btn" style="width: 100%; margin-bottom: 12px; background-color: #4cc9f0;" onclick="selectMode('online')">🌐 ऑनलाइन (500 किमी GPS / 1 मिनट)</button>
            <button class="btn" style="width: 100%; background-color: #f72585; color: white;" onclick="selectMode('local')">🤖 लोकल (असंभव हार्ड बॉट)</button>
        </div>
    </div>

    <h1>टिक-टैक-टो अल्टीमेट</h1>
    <div class="status" id="status">गेम शुरू होने वाला है...</div>

    <div class="game-container" id="main-container">
        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>

        <div class="side-panel">
            <div class="reaction-box">
                <button class="emoji-btn" onclick="sendEmoji('👍')" onmousedown="startHold('👍')" ontouchstart="startHold('👍')">👍</button>
                <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
                <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
                <button class="emoji-btn" onclick="sendEmoji('😎')">😎</button>
                <button class="emoji-btn" onclick="sendEmoji('😮')">😮</button>
                <div id="chat-display">💬</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="resetGame()">गेम रीसेट करें</button>
        <button class="btn" style="background-color: #f72585; color: white;" onclick="goHome()">मोड बदलें</button>
    </div>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = false;
        let searchTimerInterval;
        let holdTimer;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function selectMode(mode) {
            document.getElementById('mode-screen').classList.add('hidden');

            if (mode === 'online') {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => { startPlayerSearch(); },
                        (error) => { startPlayerSearch(); }
                    );
                } else {
                    startPlayerSearch();
                }
            } else {
                isGameActive = true;
                document.getElementById('status').innerText = "आपकी बारी (X) है";
            }
        }

        function startPlayerSearch() {
            let timeLeft = 60;
            document.getElementById('status').innerText = `500 किमी रेंज में खिलाड़ी खोजे जा रहे हैं... (${timeLeft}s)`;

            searchTimerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    document.getElementById('status').innerText = `500 किमी रेंज में खिलाड़ी खोजे जा रहे हैं... (${timeLeft}s)`;
                } else {
                    clearInterval(searchTimerInterval);
                    document.getElementById('status').innerText = "कोई खिलाड़ी नहीं मिला! अति कठिन बॉट से मुकाबला शुरू...";
                    setTimeout(() => {
                        isGameActive = true;
                        document.getElementById('status').innerText = "आपकी बारी (X) है";
                    }, 1500);
                }
            }, 1000);
        }

        function makeMove(index) {
            if (board[index] !== "" || !isGameActive || currentPlayer !== "X") return;

            board[index] = "X";
            document.getElementsByClassName('cell')[index].innerText = "X";

            if (checkGameOver()) return;

            currentPlayer = "O";
            document.getElementById('status').innerText = "अति बुद्धिमान बॉट (O) चाल चल रहा है...";
            
            setTimeout(botMove, 600);
        }

        // अति कठिन बॉट के लिए मिनिमैक्स (Minimax) एल्गोरिथ्म लॉजिक
        function botMove() {
            if (!isGameActive) return;

            let bestScore = -Infinity;
            let move;
            for (let i = 0; i < 9; i++) {
                if (board[i] === "") {
                    board[i] = "O";
                    let score = minimax(board, 0, false);
                    board[i] = "";
                    if (score > bestScore) {
                        bestScore = score;
                        move = i;
                    }
                }
            }

            if (move !== undefined) {
                board[move] = "O";
                document.getElementsByClassName('cell')[move].innerText = "O";
            }

            if (checkGameOver()) return;

            currentPlayer = "X";
            document.getElementById('status').innerText = "आपकी बारी (X) है";
        }

        function minimax(newBoard, depth, isMaximizing) {
            let result = evaluateBoard(newBoard);
            if (result !== null) {
                if (result === "O") return 10 - depth;
                if (result === "X") return depth - 10;
                return 0;
            }

            if (isMaximizing) {
                let maxScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (newBoard[i] === "") {
                        newBoard[i] = "O";
                        let score = minimax(newBoard, depth + 1, false);
                        newBoard[i] = "";
                        maxScore = Math.max(score, maxScore);
                    }
                }
                return maxScore;
            } else {
                let minScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (newBoard[i] === "") {
                        newBoard[i] = "X";
                        let score = minimax(newBoard, depth + 1, true);
                        newBoard[i] = "";
                        minScore = Math.min(score, minScore);
                    }
                }
                return minScore;
            }
        }

        function evaluateBoard(b) {
            for (let i = 0; i < winningConditions.length; i++) {
                let [a, c, d] = winningConditions[i];
                if (b[a] !== "" && b[a] === b[c] && b[c] === b[d]) {
                    return b[a];
                }
            }
            if (!b.includes("")) return "tie";
            return null;
        }

        function checkGameOver() {
            let res = evaluateBoard(board);
            if (res !== null) {
                isGameActive = false;
                if (res === "X") {
                    document.getElementById('status').innerText = "🥳 अद्भुत! आपने असंभव बॉट को हरा दिया! 🎉";
                    document.getElementById('main-container').classList.add('winner-animation');
                } else if (res === "O") {
                    document.getElementById('status').innerText = "🤖 बॉट जीत गया! यह मुकाबला बेहद कठिन था। 💀";
                    document.getElementById('main-container').classList.add('loser-animation');
                } else {
                    document.getElementById('status').innerText = "🤝 मुकाबला बराबरी (Draw) पर छूटा!";
                }
                return true;
            }
            return false;
        }

        function startHold(emoji) {
            holdTimer = setTimeout(() => {
                sendEmoji(emoji + "✨");
            }, 600);
        }

        function sendEmoji(emoji) {
            let chatDisplay = document.getElementById('chat-display');
            chatDisplay.innerText = emoji;
            
            chatDisplay.style.animation = 'none';
            chatDisplay.offsetHeight; 
            chatDisplay.style.animation = 'popIn 0.3s ease';

            if (isGameActive && currentPlayer === "O") {
                setTimeout(() => {
                    let botEmojis = ['🤖', '🔥', '😎', '😈', '😏'];
                    let randomEmoji = botEmojis[Math.floor(Math.random() * botEmojis.length)];
                    chatDisplay.innerText = randomEmoji;
                    
                    chatDisplay.style.animation = 'none';
                    chatDisplay.offsetHeight;
                    chatDisplay.style.animation = 'popIn 0.3s ease';
                }, 600);
            }
        }

        function resetGame() {
            clearInterval(searchTimerInterval);
            board = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            currentPlayer = "X";
            document.getElementById('status').innerText = "आपकी बारी (X) है";
            document.getElementById('chat-display').innerText = "💬";
            
            let container = document.getElementById('main-container');
            container.classList.remove('winner-animation');
            container.classList.remove('loser-animation');
            
            let cells = document.getElementsByClassName('cell');
            for (let i = 0; i < cells.length; i++) {
                cells[i].innerText = "";
            }
        }

        function goHome() {
            clearInterval(searchTimerInterval);
            resetGame();
            document.getElementById('mode-screen').classList.remove('hidden');
            isGameActive = false;
        }
    </script>
</body>
</html>
