<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अल्टीमेट टिक-टैक-टो - प्लेयर नाम</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%); 
            color: #fff;
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        h1 { margin-bottom: 5px; font-size: 26px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .status { font-size: 16px; margin-bottom: 15px; color: #f0f0f0; font-weight: bold; background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* स्क्रीन और मोडल स्टाइल */
        .screen-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 25, 0.95); display: flex; justify-content: center; align-items: center; z-index: 10; }
        .box { background: #22223b; padding: 30px; border-radius: 15px; text-align: center; max-width: 380px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .box h2 { margin-top: 0; color: #f72585; font-size: 22px; }
        .box p { color: #b5179e; font-size: 13px; margin-bottom: 20px; }
        
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #4361ee; border-radius: 8px; background: #1e1e2f; color: #fff; font-size: 15px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #f72585; }

        .game-container { display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 10px; }
        
        .board { display: grid; grid-template-columns: repeat(3, 95px); grid-gap: 8px; justify-content: center; background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .cell { width: 95px; height: 95px; background-color: #3a0ca3; color: #fff; font-size: 40px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: all 0.2s ease; }
        .cell:hover { background-color: #4361ee; transform: translateY(-2px); }

        /* प्लेयर कार्ड्स */
        .player-info-card { background: #22223b; padding: 12px 18px; border-radius: 12px; font-size: 15px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; width: 180px; text-align: center; }
        .player-info-card span { color: #4cc9f0; font-weight: bold; display: block; font-size: 16px; margin-top: 3px; }

        .reaction-box {
            background: #22223b;
            padding: 10px 15px;
            border-radius: 30px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .emoji-btn {
            font-size: 20px;
            background: #3a0ca3;
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .emoji-btn:hover { transform: scale(1.2); background: #4361ee; }

        #chat-display {
            width: 45px;
            height: 45px;
            font-size: 24px;
            background: linear-gradient(135deg, #f72585 0%, #7209b7 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-left: 5px;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .winner-animation { animation: winPulse 0.8s infinite alternate; }
        @keyframes winPulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px #4cc9f0); }
            100% { transform: scale(1.03); filter: drop-shadow(0 0 25px #4cc9f0); }
        }

        .loser-animation { animation: loseShake 0.5s ease; }
        @keyframes loseShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .side-panel { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .controls { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        .btn { background-color: #4cc9f0; color: #1e1e2f; border: none; padding: 10px 20px; font-size: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: all 0.2s; }
        .btn:hover { background-color: #3fe0ff; transform: translateY(-2px); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. प्रोफाइल रजिस्ट्रेशन स्क्रीन (केवल प्लेयर का नाम) -->
    <div id="profile-screen" class="screen-overlay">
        <div class="box">
            <h2>अपना नाम दर्ज करें</h2>
            <p>गेम में पहचान के लिए अपना नाम लिखें</p>
            <input type="text" id="user-name" placeholder="आपका नाम (जैसे: राहुल)">
            <button class="btn" style="width: 100%; margin-top: 10px; background-color: #4cc9f0;" onclick="saveProfile()">आगे बढ़ें</button>
        </div>
    </div>

    <!-- 2. गेम मोड चयन स्क्रीन -->
    <div id="mode-screen" class="screen-overlay hidden">
        <div class="box">
            <h2>गेम मोड चुनें</h2>
            <p>चुनें कि आप किसके साथ मुकाबला करना चाहते हैं</p>
            <button class="btn" style="width: 100%; margin-bottom: 12px; background-color: #4cc9f0;" onclick="selectMode('online')">🌐 ऑनलाइन (500 किमी नियरेस्ट प्लेयर)</button>
            <button class="btn" style="width: 100%; background-color: #f72585; color: white;" onclick="selectMode('local')">🤖 लोकल (असंभव हार्ड बॉट)</button>
        </div>
    </div>

    <h1>टिक-टैक-टो अल्टीमेट</h1>
    <div class="status" id="status">गेम शुरू होने वाला है...</div>

    <div class="game-container" id="main-container">
        <!-- दोनों खिलाड़ियों का नाम दिखाने का पैनल -->
        <div class="side-panel">
            <div class="player-info-card">
                <div>खिलाड़ी 1 (X)</div>
                <span id="p1-display">---</span>
            </div>
            <div class="player-info-card">
                <div>खिलाड़ी 2 (O)</div>
                <span id="p2-display">---</span>
            </div>
        </div>

        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>

        <div class="side-panel">
            <div class="reaction-box">
                <button class="emoji-btn" onclick="sendEmoji('👍')" onmousedown="startHold('👍')" ontouchstart="startHold('👍')">👍</button>
                <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
                <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
                <button class="emoji-btn" onclick="sendEmoji('😎')">😎</button>
                <button class="emoji-btn" onclick="sendEmoji('😮')">😮</button>
                <div id="chat-display">💬</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="resetGame()">गेम रीसेट करें</button>
        <button class="btn" style="background-color: #f72585; color: white;" onclick="goHome()">मोड बदलें</button>
    </div>

    <script>
        let myName = "";
        let opponentName = "";

        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = false;
        let searchTimerInterval;
        let holdTimer;
        let gameMode = "";

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function saveProfile() {
            let nameInput = document.getElementById('user-name').value.trim();

            if (!nameInput) {
                alert("कृपया अपना नाम दर्ज करें!");
                return;
            }

            myName = nameInput;

            document.getElementById('profile-screen').classList.add('hidden');
            document.getElementById('mode-screen').classList.remove('hidden');
            
            document.getElementById('p1-display').innerText = myName;
        }

        function selectMode(mode) {
            gameMode = mode;
            document.getElementById('mode-screen').classList.add('hidden');

            if (mode === 'online') {
                document.getElementById('status').innerText = "500 किमी के दायरे में नियरेस्ट प्लेयर खोजा जा रहा है...";
                
                let timer = 5;
                searchTimerInterval = setInterval(() => {
                    timer--;
                    if (timer > 0) {
                        document.getElementById('status').innerText = `नियरेस्ट प्लेयर तलाश रहे हैं... (${timer}s)`;
                    } else {
                        clearInterval(searchTimerInterval);
                        opponentName = "विक्रम (Online)";
                        
                        document.getElementById('p2-display').innerText = opponentName;
                        
                        document.getElementById('status').innerText = `${opponentName} मिल गया! मैच शुरू...`;
                        setTimeout(() => {
                            isGameActive = true;
                            document.getElementById('status').innerText = `${myName} की बारी (X) है`;
                        }, 1200);
                    }
                }, 1000);

            } else {
                opponentName = "असंभव बॉट";
                
                document.getElementById('p2-display').innerText = opponentName;

                isGameActive = true;
                document.getElementById('status').innerText = `${myName} की बारी (X) है`;
            }
        }

        function makeMove(index) {
            if (board[index] !== "" || !isGameActive || currentPlayer !== "X") return;

            board[index] = "X";
            document.getElementsByClassName('cell')[index].innerText = "X";

            if (checkGameOver()) return;

            currentPlayer = "O";
            document.getElementById('status').innerText = `${opponentName} चाल चल रहा है...`;
            
            setTimeout(botMove, 700);
        }

        function botMove() {
            if (!isGameActive) return;

            let bestScore = -Infinity;
            let move;
            for (let i = 0; i < 9; i++) {
                if (board[i] === "") {
                    board[i] = "O";
                    let score = minimax(board, 0, false);
                    board[i] = "";
                    if (score > bestScore) {
                        bestScore = score;
                        move = i;
                    }
                }
            }

            if (move !== undefined) {
                board[move] = "O";
                document.getElementsByClassName('cell')[move].innerText = "O";
            }

            if (checkGameOver()) return;

            currentPlayer = "X";
            document.getElementById('status').innerText = `${myName} की बारी (X) है`;
        }

        function minimax(newBoard, depth, isMaximizing) {
            let result = evaluateBoard(newBoard);
            if (result !== null) {
                if (result === "O") return 10 - depth;
                if (result === "X") return depth - 10;
                return 0;
            }

            if (isMaximizing) {
                let maxScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (newBoard[i] === "") {
                        newBoard[i] = "O";
                        let score = minimax(newBoard, depth + 1, false);
                        newBoard[i] = "";
                        maxScore = Math.max(score, maxScore);
                    }
                }
                return maxScore;
            } else {
                let minScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (newBoard[i] === "") {
                        newBoard[i] = "X";
                        let score = minimax(newBoard, depth + 1, true);
                        newBoard[i] = "";
                        minScore = Math.min(score, minScore);
                    }
                }
                return minScore;
            }
        }

        function evaluateBoard(b) {
            for (let i = 0; i < winningConditions.length; i++) {
                let [a, c, d] = winningConditions[i];
                if (b[a] !== "" && b[a] === b[c] && b[c] === b[d]) {
                    return b[a];
                }
            }
            if (!b.includes("")) return "tie";
            return null;
        }

        function checkGameOver() {
            let res = evaluateBoard(board);
            if (res !== null) {
                isGameActive = false;
                let container = document.getElementById('main-container');
                if (res === "X") {
                    document.getElementById('status').innerText = `🥳 अद्भुत! ${myName} जीत गए! 🎉`;
                    container.classList.add('winner-animation');
                } else if (res === "O") {
                    document.getElementById('status').innerText = `🤖 ${opponentName} जीत गया!`;
                    container.classList.add('loser-animation');
                } else {
                    document.getElementById('status').innerText = "🤝 मुकाबला बराबरी (Draw) पर छूटा!";
                }
                return true;
            }
            return false;
        }

        function startHold(emoji) {
            holdTimer = setTimeout(() => {
                sendEmoji(emoji + "✨");
            }, 600);
        }

        function sendEmoji(emoji) {
            let chatDisplay = document.getElementById('chat-display');
            chatDisplay.innerText = emoji;
            
            chatDisplay.style.animation = 'none';
            chatDisplay.offsetHeight; 
            chatDisplay.style.animation = 'popIn 0.3s ease';

            if (isGameActive && currentPlayer === "O") {
                setTimeout(() => {
                    let botEmojis = ['🤖', '🔥', '😎', '😈', '😏'];
                    let randomEmoji = botEmojis[Math.floor(Math.random() * botEmojis.length)];
                    chatDisplay.innerText = randomEmoji;
                    
                    chatDisplay.style.animation = 'none';
                    chatDisplay.offsetHeight;
                    chatDisplay.style.animation = 'popIn 0.3s ease';
                }, 600);
            }
        }

        function resetGame() {
            clearInterval(searchTimerInterval);
            board = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            currentPlayer = "X";
            document.getElementById('status').innerText = `${myName} की बारी (X) है`;
            document.getElementById('chat-display').innerText = "💬";
            
            let container = document.getElementById('main-container');
            container.classList.remove('winner-animation');
            container.classList.remove('loser-animation');
            
            let cells = document.getElementsByClassName('cell');
            for (let i = 0; i < cells.length; i++) {
                cells[i].innerText = "";
            }
        }

        function goHome() {
            clearInterval(searchTimerInterval);
            resetGame();
            document.getElementById('profile-screen').classList.remove('hidden');
            isGameActive = false;
        }
    </script>
</body>
</html>
