name: Daily AI Content Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests google-generativeai

      - name: Run AI Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_content.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'AI Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add content.json
          git commit -m "Auto-update AI content for the day"
          git push
          
