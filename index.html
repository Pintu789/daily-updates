<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>टिक-टैक-टो गेम</title>
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 20px; }
        h1 { color: #333; margin-bottom: 10px; }
        .status { font-size: 18px; margin-bottom: 20px; color: #555; font-weight: bold; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); grid-gap: 8px; justify-content: center; margin-bottom: 20px; }
        .cell { width: 100px; height: 100px; background-color: white; font-size: 40px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: background 0.2s; }
        .cell:hover { background-color: #e9ecef; }
        .reset-btn { background-color: #007bff; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        .reset-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h1>टिक-टैक-टो (Tic-Tac-Toe)</h1>
    <div class="status" id="status">खिलाड़ी X की बारी है</div>

    <div class="board" id="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
    </div>

    <button class="reset-btn" onclick="resetGame()">गेम रीसेट करें</button>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = true;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // पंक्तियाँ (Rows)
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // कॉलम (Columns)
            [0, 4, 8], [2, 4, 6]            // विकर्ण (Diagonals)
        ];

        function makeMove(index) {
            if (board[index] !== "" || !isGameActive) return;

            board[index] = currentPlayer;
            document.getElementsByClassName('cell')[index].innerText = currentPlayer;

            checkResult();
        }

        function checkResult() {
            let roundWon = false;

            for (let i = 0; i < winningConditions.length; i++) {
                let [a, b, c] = winningConditions[i];
                if (board[a] === "" || board[b] === "" || board[c] === "") continue;
                if (board[a] === board[b] && board[b] === board[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                document.getElementById('status').innerText = `खिलाड़ी ${currentPlayer} जीत गया! 🎉`;
                isGameActive = false;
                return;
            }

            if (!board.includes("")) {
                document.getElementById('status').innerText = `मैच ड्रॉ (Tie) हो गया! 🤝`;
                isGameActive = false;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            document.getElementById('status').innerText = `खिलाड़ी ${currentPlayer} की बारी है`;
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            currentPlayer = "X";
            document.getElementById('status').innerText = `खिलाड़ी X की बारी है`;
            
            let cells = document.getElementsByClassName('cell');
            for (let i = 0; i < cells.length; i++) {
                cells[i].innerText = "";
            }
        }
    </script>
</body>
</html>
